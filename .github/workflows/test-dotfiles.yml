name: Test macOS Dotfiles

on:
  push:
    branches-ignore: [ master ]  # Run on all branches except master
  pull_request:
    branches: [ master ]  # Run PRs targeting master

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link dotfiles for CI
        run: ln -s "${{ github.workspace }}" "$HOME/.dotfiles"
      - name: Bootstrap macOS
        run: bash -x ./install_macos.sh
      - name: Run unified checker
        run: bash tests/test_install.sh
